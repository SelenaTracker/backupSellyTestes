<!-- ========== SISTEMA DE VOTAÇÃO ========== -->
<style>
/* SISTEMA DE VOTAÇÃO - PRÓXIMO FOCO */
#sistema-votacao-2026 {
    font-family: 'Segoe UI', system-ui, sans-serif;
}

/* CARD PRINCIPAL */
.proximo-foco-card {
    background: linear-gradient(135deg, #9B5DE5 0%, #6c5ce7 50%, #5A4FCF 100%);
    border-radius: 12px;
    padding: 20px;
    color: white;
    box-shadow: 0 8px 30px rgba(108, 92, 231, 0.2);
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
}

.pf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.pf-icon {
    font-size: 24px;
    margin-right: 10px;
}

.pf-title {
    font-size: 20px;
    font-weight: bold;
    flex-grow: 1;
}

.pf-status {
    background: rgba(255, 255, 255, 0.2);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.pf-timer {
    background: rgba(255, 255, 255, 0.1);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
}

.timer-icon {
    margin-right: 8px;
}

#countdown {
    font-weight: bold;
    color: #FFD700;
}

.pf-option {
    margin-bottom: 12px;
}

.option-name {
    font-size: 14px;
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
}

.option-bar {
    height: 8px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #1DB954, #1ED760);
    border-radius: 4px;
    transition: width 0.5s ease;
}

.option-percent {
    font-size: 12px;
    text-align: right;
    margin-top: 3px;
    color: rgba(255, 255, 255, 0.8);
}

.pf-vote-btn {
    background: #1DB954;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
    margin-top: 15px;
    transition: all 0.3s;
    font-size: 16px;
}

.pf-vote-btn:hover {
    background: #1ED760;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(29, 185, 84, 0.3);
}

.pf-footer {
    margin-top: 15px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    color: rgba(255, 255, 255, 0.7);
}

/* MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-container {
    background: white;
    border-radius: 16px;
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    animation: modalAppear 0.3s ease;
}

@keyframes modalAppear {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.modal-header {
    padding: 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h3 {
    color: #333;
    margin: 0;
}

.modal-close {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: #666;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-close:hover {
    color: #333;
}

.modal-body {
    padding: 20px;
}

.modal-subtitle {
    color: #666;
    margin-bottom: 20px;
    font-size: 14px;
}

.modal-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.modal-option {
    display: flex;
    align-items: center;
    padding: 15px;
    border: 2px solid #eee;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
}

.modal-option:hover {
    border-color: #6c5ce7;
    background: #f9f9ff;
}

.modal-option input[type="radio"] {
    display: none;
}

.modal-option input[type="radio"]:checked + .radio-custom {
    background: #6c5ce7;
    border-color: #6c5ce7;
}

.modal-option input[type="radio"]:checked + .radio-custom::after {
    content: '';
    display: block;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    margin: 3px;
}

.radio-custom {
    width: 16px;
    height: 16px;
    border: 2px solid #ddd;
    border-radius: 50%;
    margin-right: 15px;
    flex-shrink: 0;
}

.option-content {
    flex-grow: 1;
}

.option-title {
    display: block;
    font-weight: bold;
    color: #333;
    margin-bottom: 4px;
}

.option-stats {
    display: block;
    font-size: 13px;
    color: #666;
}

.modal-footer {
    padding: 20px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.modal-btn {
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
}

.modal-btn.cancelar {
    background: #f0f2f5;
    color: #666;
}

.modal-btn.cancelar:hover {
    background: #e4e6e9;
}

.modal-btn.confirmar {
    background: #6c5ce7;
    color: white;
}

.modal-btn.confirmar:hover:not(:disabled) {
    background: #5d4de0;
}

.modal-btn.confirmar:disabled {
    background: #ccc;
    cursor: not-allowed;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    .proximo-foco-card {
        max-width: 100%;
    }
    
    .modal-container {
        width: 95%;
        margin: 10px;
    }
    
    .modal-footer {
        flex-direction: column;
    }
    
    .modal-btn {
        width: 100%;
    }
}
</style>

<script>
// ========== SISTEMA DE VOTAÇÃO - JAVASCRIPT COMPLETO ==========
(function() {
    // CONFIGURAÇÃO
    const config = {
        googleSheetsId: '1QIVRYyMhp397Pn7K6Eox4-SGKzLoy-DybQC2NLpX4VY',
        musicas: [
            { id: 'year', nome: 'A Year Without Rain' },
            { id: 'guess', nome: 'Guess You Could Say I\'m in Love' },
            { id: 'mind', nome: 'My Mind & Me' },
            { id: 'anxiety', nome: 'Anxiety (feat. Julia Michaels)' }
        ],
        duracaoDias: 2,
        containerId: 'sistema-votacao-2026'
    };

    // ELEMENTOS
    let container, modalOverlay, modalContainer;
    
    // DADOS DA VOTAÇÃO
    let votacaoData = {
        encerraEm: new Date(Date.now() + config.duracaoDias * 24 * 60 * 60 * 1000),
        votos: {},
        totalVotos: 0,
        usuarioJaVotou: localStorage.getItem('votacao_ja_votou') === 'true'
    };

    // INICIALIZAR
    function inicializar() {
        container = document.getElementById(config.containerId);
        if (!container) {
            console.error('Container não encontrado:', config.containerId);
            return;
        }

        // Inicializar votos
        config.musicas.forEach(musica => {
            votacaoData.votos[musica.id] = {
                nome: musica.nome,
                votos: 0,
                percent: 0
            };
        });

        // Carregar dados iniciais
        carregarVotosIniciais();
        
        // Criar interface
        criarInterface();
        
        // Iniciar timer
        atualizarCountdown();
        setInterval(atualizarCountdown, 60000);
    }

    // CARREGAR VOTOS INICIAIS (mock - depois do Google Sheets)
    function carregarVotosIniciais() {
        // Valores iniciais mockados
        const votosMock = {
            year: 325,
            guess: 210,
            mind: 160,
            anxiety: 125
        };
        
        let total = 0;
        Object.keys(votosMock).forEach(id => {
            votacaoData.votos[id].votos = votosMock[id];
            total += votosMock[id];
        });
        
        votacaoData.totalVotos = total;
        
        // Calcular percentuais
        Object.keys(votacaoData.votos).forEach(id => {
            votacaoData.votos[id].percent = Math.round((votacaoData.votos[id].votos / total) * 100);
        });
    }

    // CRIAR INTERFACE
    function criarInterface() {
        container.innerHTML = `
            <div class="proximo-foco-card">
                <div class="pf-header">
                    <span class="pf-icon">🗳️</span>
                    <span class="pf-title">Próximo Foco</span>
                    <span class="pf-status">VOTAÇÃO ATIVA</span>
                </div>
                
                <div class="pf-timer">
                    <span class="timer-icon">⏰</span>
                    <span class="timer-text">Encerra em: <span id="countdown">${calcularCountdown()}</span></span>
                </div>
                
                <div class="pf-options">
                    ${config.musicas.map(musica => `
                        <div class="pf-option">
                            <div class="option-name">${musica.nome}</div>
                            <div class="option-bar">
                                <div class="bar-fill" style="width: ${votacaoData.votos[musica.id].percent}%"></div>
                            </div>
                            <div class="option-percent">${votacaoData.votos[musica.id].percent}%</div>
                        </div>
                    `).join('')}
                </div>
                
                <button class="pf-vote-btn" id="abrirModalVotacao">
                    ${votacaoData.usuarioJaVotou ? '✅ VOCÊ JÁ VOTOU HOJE' : '🗳️ VOTAR AGORA'}
                </button>
                
                <div class="pf-footer">
                    <small>Total de votos: <span id="totalVotos">${votacaoData.totalVotos}</span></small>
                    <small>${votacaoData.usuarioJaVotou ? 'Você já votou hoje' : '1 voto por dia'}</small>
                </div>
            </div>
            
            <!-- MODAL -->
            <div class="modal-overlay" id="modalOverlayVotacao">
                <div class="modal-container">
                    <div class="modal-header">
                        <h3>🗳️ VOTE NO PRÓXIMO FOCO</h3>
                        <button class="modal-close" id="fecharModalVotacao">&times;</button>
                    </div>
                    
                    <div class="modal-body">
                        <p class="modal-subtitle">Escolha qual música será o foco dos próximos dias:</p>
                        
                        <div class="modal-options">
                            ${config.musicas.map(musica => `
                                <label class="modal-option">
                                    <input type="radio" name="voto" value="${musica.id}">
                                    <span class="radio-custom"></span>
                                    <span class="option-content">
                                        <span class="option-title">${musica.nome}</span>
                                        <span class="option-stats">${votacaoData.votos[musica.id].percent}% • ${votacaoData.votos[musica.id].votos} votos</span>
                                    </span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button class="modal-btn cancelar" id="cancelarVoto">CANCELAR</button>
                        <button class="modal-btn confirmar" id="confirmarVoto" disabled>CONFIRMAR VOTO</button>
                    </div>
                </div>
            </div>
        `;
        
        // Adicionar event listeners
        adicionarEventListeners();
    }

    // ADICIONAR EVENT LISTENERS
    function adicionarEventListeners() {
        // Abrir modal
        const abrirBtn = document.getElementById('abrirModalVotacao');
        if (abrirBtn) {
            abrirBtn.addEventListener('click', abrirModal);
        }

        // Elementos do modal
        modalOverlay = document.getElementById('modalOverlayVotacao');
        const fecharBtn = document.getElementById('fecharModalVotacao');
        const cancelarBtn = document.getElementById('cancelarVoto');
        const confirmarBtn = document.getElementById('confirmarVoto');
        const radioBtns = document.querySelectorAll('input[name="voto"]');

        // Fechar modal
        if (fecharBtn) fecharBtn.addEventListener('click', fecharModal);
        if (cancelarBtn) cancelarBtn.addEventListener('click', fecharModal);
        if (modalOverlay) {
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) fecharModal();
            });
        }

        // Habilitar botão confirmar quando selecionar
        radioBtns.forEach(radio => {
            radio.addEventListener('change', () => {
                if (confirmarBtn) confirmarBtn.disabled = false;
            });
        });

        // Confirmar voto
        if (confirmarBtn) {
            confirmarBtn.addEventListener('click', confirmarVoto);
        }

        // Tecla ESC fecha modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay && modalOverlay.style.display === 'flex') {
                fecharModal();
            }
        });
    }

    // FUNÇÕES DO MODAL
    function abrirModal() {
        if (votacaoData.usuarioJaVotou) {
            alert("🎵 Você já votou hoje! Volte amanhã para votar novamente.");
            return;
        }
        
        if (modalOverlay) {
            modalOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
    }

    function fecharModal() {
        if (modalOverlay) {
            modalOverlay.style.display = 'none';
            document.body.style.overflow = 'auto';
            
            // Resetar seleção
            const radioBtns = document.querySelectorAll('input[name="voto"]');
            radioBtns.forEach(radio => radio.checked = false);
            
            const confirmarBtn = document.getElementById('confirmarVoto');
            if (confirmarBtn) confirmarBtn.disabled = true;
        }
    }

    function confirmarVoto() {
        const opcaoSelecionada = document.querySelector('input[name="voto"]:checked');
        
        if (!opcaoSelecionada) return;
        
        const musicaId = opcaoSelecionada.value;
        const musicaNome = votacaoData.votos[musicaId].nome;
        
        // Simular voto
        votacaoData.votos[musicaId].votos += 1;
        votacaoData.totalVotos += 1;
        
        // Recalcular percentuais
        Object.keys(votacaoData.votos).forEach(id => {
            votacaoData.votos[id].percent = Math.round((votacaoData.votos[id].votos / votacaoData.totalVotos) * 100);
        });
        
        // Marcar que usuário já votou
        votacaoData.usuarioJaVotou = true;
        localStorage.setItem('votacao_ja_votou', 'true');
        
        // Atualizar interface
        atualizarInterface();
        
        // Fechar modal e mostrar confirmação
        fecharModal();
        
        // Mostrar mensagem de sucesso
        const mensagem = document.createElement('div');
        mensagem.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1DB954;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 10000;
            animation: slideIn 0.3s ease;
        `;
        mensagem.innerHTML = `✅ Voto registrado para <strong>${musicaNome}</strong>!`;
        document.body.appendChild(mensagem);
        
        setTimeout(() => {
            mensagem.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => mensagem.remove(), 300);
        }, 3000);
        
        // Adicionar animação CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    }

    // ATUALIZAR INTERFACE
    function atualizarInterface() {
        // Atualizar botão
        const votarBtn = document.getElementById('abrirModalVotacao');
        if (votarBtn) {
            votarBtn.textContent = '✅ VOCÊ JÁ VOTOU HOJE';
            votarBtn.style.background = '#95a5a6';
            votarBtn.style.cursor = 'not-allowed';
            votarBtn.onclick = () => {
                alert("🎵 Você já votou hoje! Volte amanhã para votar novamente.");
            };
        }
        
        // Atualizar barras de progresso
        config.musicas.forEach(musica => {
            const barra = document.querySelector(`.bar-fill[style*="${votacaoData.votos[musica.id].percent}%"]`);
            if (barra) {
                barra.style.width = `${votacaoData.votos[musica.id].percent}%`;
            }
            
            const percent = document.querySelector(`.option-percent`);
            if (percent) {
                percent.textContent = `${votacaoData.votos[musica.id].percent}%`;
            }
        });
        
        // Atualizar total de votos
        const totalEl = document.getElementById('totalVotos');
        if (totalEl) totalEl.textContent = votacaoData.totalVotos;
        
        // Atualizar texto do footer
        const footerText = document.querySelector('.pf-footer small:last-child');
        if (footerText) footerText.textContent = 'Você já votou hoje';
    }

    // COUNTDOWN FUNCTIONS
    function calcularCountdown() {
        const agora = new Date();
        const diferenca = votacaoData.encerraEm - agora;
        
        if (diferenca <= 0) {
            return "VOTAÇÃO ENCERRADA";
        }
        
        const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
        
        return `${dias}d ${horas}h ${minutos}m`;
    }

    function atualizarCountdown() {
        const countdownEl = document.getElementById('countdown');
        if (countdownEl) {
            countdownEl.textContent = calcularCountdown();
        }
    }

    // INICIAR QUANDO A PÁGINA CARREGAR
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', inicializar);
    } else {
        inicializar();
    }
})();
</script>
<!-- ========== FIM SISTEMA ========== -->
